<style>
:root{--bg:#101418;--card:#1a2026;--card2:#20272e;--line:#2b333c;--txt:#e8ebee;--sub:#8b96a0;--kev:#4cc38a;--leo:#5aa9f0;--jam:#e0a84c;--a:#4cc38a;--b:#5aa9f0;--c:#6b7680;--warn:#e0a84c;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding:12px;max-width:600px;margin:0 auto;}
h1{font-size:17px;font-weight:600;margin-bottom:10px;}
.tabs{display:flex;gap:5px;margin-bottom:12px;}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:8px 0;font-size:12.5px;font-weight:600;}
.tabs button.on{background:var(--card2);color:var(--txt);border-color:#3d4854;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.card .lbl{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;}
.sec{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 4px;}
.row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.rk{font-size:11.5px;color:var(--sub);width:26px;text-align:right;flex-shrink:0;}
.gr{font-size:11px;font-weight:700;border-radius:6px;padding:2px 0;width:20px;text-align:center;flex-shrink:0;}
.gr.A{background:rgba(76,195,138,.15);color:var(--a);}
.gr.B{background:rgba(90,169,240,.15);color:var(--b);}
.gr.C{background:rgba(107,118,128,.2);color:var(--c);}
.pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pn small{color:var(--sub);font-size:11px;margin-left:4px;}
.val{font-size:12.5px;color:var(--sub);flex-shrink:0;width:44px;text-align:right;}
.own{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;flex-shrink:0;width:34px;text-align:center;}
.own.K{background:rgba(76,195,138,.15);color:var(--kev);}
.own.L{background:rgba(90,169,240,.15);color:var(--leo);}
.own.J{background:rgba(224,168,76,.15);color:var(--jam);}
.own.F{background:transparent;color:#4a545e;border:1px solid var(--line);}
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;}
.filters button.on{background:var(--card2);color:var(--txt);border-color:#3d4854;}
input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px;}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.team{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.team .tn{font-size:13px;font-weight:600;}
.team.kev{border-color:rgba(76,195,138,.5);}
.team.kev .tn{color:var(--kev);}.team.leo .tn{color:var(--leo);}.team.jam .tn{color:var(--jam);}
.team .score{font-size:18px;font-weight:600;}
.team .meta{font-size:11px;color:var(--sub);line-height:1.5;}
.note{font-size:12.5px;color:var(--sub);line-height:1.55;margin-bottom:10px;}
.note b{color:var(--txt);}
.fxbar{display:inline-block;width:44px;text-align:center;font-size:11px;font-weight:700;border-radius:5px;padding:2px 0;flex-shrink:0;}
.fx5{background:rgba(76,195,138,.2);color:var(--a);}
.fx4{background:rgba(76,195,138,.12);color:#7fd0a5;}
.fx3{background:rgba(139,150,160,.15);color:var(--sub);}
.fx2{background:rgba(224,168,76,.15);color:var(--warn);}
.fx1{background:rgba(224,110,90,.18);color:#e08a76;}
select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px;width:100%;}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--sub);margin:2px 2px 2px 0;}
</style>

    return '<div class="row"'+(inj===2?' style="opacity:.4"':'')+'><span class="fxbar fx'+fxOf(x.t)+'">'+x.t+'</span><span class="pn">'+x.n+'<small>'+POSNAME[x.p]+'</small></span>'+moChip+'<span class="val">'+x.e.toFixed(1)+'</span><button onclick="cycleInj(\''+esc(x.n)+'\')" style="border:1px solid var(--line);background:'+(inj===2?'rgba(224,110,90,.18)':inj===1?'rgba(224,168,76,.15)':'transparent')+';color:'+(inj===2?'#e08a76':inj===1?'var(--warn)':'var(--sub)')+';border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;flex-shrink:0;width:52px;">'+INJLBL[inj]+'</button></div>';
  }
  h+='<div class="card"><div class="lbl">Recommended XI &middot; Gameweek '+gwSel+'</div>';
  xi.sort((a,b)=>ORDER[a.p]-ORDER[b.p]||b.e-a.e).forEach(x=>{h+=prow(x)});
  h+='</div><div class="card"><div class="lbl">Bench</div>';
  bench.sort((a,b)=>b.e-a.e).forEach(x=>{h+=prow(x)});
  h+='</div>';
  const free=P.filter(x=>x.o==="F").map(x=>({...x,e:gwScore(x)})).sort((a,b)=>b.e-a.e);
  h+='<div class="card"><div class="lbl">Waiver targets this gameweek</div>';
  let shown=0;
  free.forEach(x=>{if(shown>=10)return;
    const weak=mine.filter(y=>y.p===x.p).sort((a,b)=>a.e-b.e)[0];
    if(weak&&x.e>weak.e){shown++;
      h+='<div class="row"><span class="fxbar fx'+fxOf(x.t)+'">'+x.t+'</span><span class="pn">'+x.n+'<small>'+POSNAME[x.p]+'</small></span><span class="val">'+x.e.toFixed(1)+'</span><span style="font-size:11px;color:var(--sub);flex-shrink:0;">for '+weak.n.split(" ").slice(-1)[0]+' ('+weak.e.toFixed(1)+')</span></div>';}
  });
  if(!shown)h+='<div class="note" style="margin:0">No free agent beats this squad this week. Hold.</div>';
  h+='</div>';
  h+='<div class="note"><b>One score, four inputs.</b> Week score = draft value (player quality, fixed at draft night) &times; this week\'s fixture &times; availability &times; momentum. Refresh updates the last three; quality only changes when we re-run the board together. Tap any status button to override manually. Weekly ritual: Friday before deadline, refresh (in the Claude viewer) or paste a data pack from chat (in Chrome), then read the XI and waiver list. Momentum arrows show hot and cold streaks from the latest refresh. Ekitike preset Out until spring. Never drop an A-grade on one bad week; momentum is a tiebreaker, not a strategy.</div>';
  return h;
}
document.querySelector(".tabs").addEventListener("click",e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}});
render();
</script>
</body>
</html>
